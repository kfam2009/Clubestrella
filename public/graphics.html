<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Estrella · Marcador OBS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}
#bar{position:absolute;left:8%;right:8%;bottom:9%;height:6%;min-height:38px;display:flex;background:#08090b;border-top:3px solid #e83940;box-sizing:border-box}
.cell{display:flex;align-items:center;justify-content:center;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.brand{width:6%;color:#ffd348;font-size:1.6vw;font-weight:900;border-right:2px solid #59616d}
.team{flex:1;justify-content:flex-start;padding:0 1%;font-size:1.7vw;font-weight:800;text-overflow:ellipsis}
.score{width:6%;background:#f1f3f5;color:#101217;font-size:2.6vw;font-weight:900;font-variant-numeric:tabular-nums}
.period{width:6%;font-size:1.8vw;border-left:2px solid #5d6470}
.clock{width:11%;font-size:2vw;font-weight:800;border-left:2px solid #5d6470;font-variant-numeric:tabular-nums}
.info{width:19%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 1%;border-left:2px solid #5d6470;font-size:1vw;line-height:1.3}
.info strong,.info span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.logo{display:none;width:4%;object-fit:contain;padding:3px}
#warning{position:absolute;left:8%;bottom:16%;font-size:1vw;background:#7b4c0e;padding:5px 10px;display:none}
</style></head><body>
<div id="bar"><div class="cell brand">CAE</div><img id="homeLogo" class="logo" alt=""><div id="homeName" class="cell team">ESTRELLA</div><div id="homeScore" class="cell score">--</div><img id="awayLogo" class="logo" alt=""><div id="awayName" class="cell team">VISITA</div><div id="awayScore" class="cell score">--</div><div id="period" class="cell period">--</div><div id="clock" class="cell clock">--:--</div><div class="info"><strong id="tournament">CLUB ESTRELLA</strong><span id="category"></span></div></div>
<script>
(function(){
 var fields=['clock','homeScore','awayScore','period'],last=0,lastGood=false;
 var params=new URLSearchParams(location.search),manual=params.get('live')==='0';
 var settings={};try{settings=JSON.parse(localStorage.getItem('club-estrella-settings-v1')||'{}');}catch(e){}
 ['homeName','awayName','tournament','category'].forEach(function(k){var v=params.get(k)||settings[k];if(v)document.getElementById(k).textContent=v;});
 ['homeLogo','awayLogo'].forEach(function(k){var v=params.get(k)||settings[k];if(v){var n=document.getElementById(k);n.src=v;n.style.display='block';}});
 function applySettings(values){if(!values)return;['homeName','awayName','tournament','category'].forEach(function(k){if(typeof values[k]==='string')document.getElementById(k).textContent=values[k];});['homeLogo','awayLogo'].forEach(function(k){if(typeof values[k]!=='string')return;var n=document.getElementById(k),v=values[k];if(v&&n.getAttribute('src')!==v)n.src=v;n.style.display=v?'block':'none';});}
 function accept(s){applySettings(s.graphicSettings);if(s.service!=='club-estrella')return;last=Date.now();lastGood=!!s.connected&&s.ocrStatus==='ok';fields.forEach(function(k){if(typeof s[k]==='string')document.getElementById(k).textContent=s[k];});}
 function health(){}
 function pollSettings(){if(location.hostname!=='127.0.0.1'&&location.hostname!=='localhost')return;var c=new XMLHttpRequest();c.open('GET','http://127.0.0.1:8774/settings',true);c.timeout=2500;c.onload=function(){try{if(c.status===200)applySettings(JSON.parse(c.responseText));}catch(e){}};c.send();}
 function poll(){pollSettings();var x=new XMLHttpRequest();x.open('GET','api/state',true);x.timeout=3000;x.onload=function(){try{if(x.status===200)accept(JSON.parse(x.responseText));}catch(e){}health();};x.onerror=health;x.ontimeout=health;x.send();}
 if(manual){fields.forEach(function(k){if(params.has(k))document.getElementById(k).textContent=params.get(k);});}
 else{poll();setInterval(poll,1500);setInterval(health,1000);}
})();
</script></body></html>
