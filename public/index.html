<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Estrella — Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="control-page">
  <aside class="control-panel">
    <header class="control-head">

      <div>
        <strong>Club Estrella</strong>
        <span>Reloj · período · local · visita</span>
      </div>
    </header>

    <section class="control-grid">
      <label>Local
        <input id="homeName" value="ESTRELLA">
      </label>
      <label>Puntos local
        <input id="homeScore" value="15" inputmode="numeric">
      </label>
      <label>Logo local
        <input id="homeLogo" list="logoOptions" value="assets/page-04-image-04.png">
      </label>
      <label>Archivo logo local
        <input id="homeLogoFile" type="file" accept="image/*">
      </label>

      <label>Visita
        <input id="awayName" value="VISITA">
      </label>
      <label>Puntos visita
        <input id="awayScore" value="17" inputmode="numeric">
      </label>
      <label>Logo visita
        <input id="awayLogo" list="logoOptions" value="assets/page-04-image-02.png">
      </label>
      <label>Archivo logo visita
        <input id="awayLogoFile" type="file" accept="image/*">
      </label>

      <label>Cuarto
        <input id="period" value="1C">
      </label>
      <label>Reloj
        <input id="clock" value="3:46">
      </label>


      <label>Linea torneo
        <input id="tournament" value="LIGA PROVINCIAL FBB">
      </label>
      <label>Linea categoria / zona
        <input id="category" value="U15 M - NORTE 2 / ZONA C">
      </label>
    </section>

    <div class="control-actions">
      <a href="https://github.com/kfam2009/Clubestrella/archive/refs/heads/main.zip">Descargar lector para la PC</a>
      <a id="rendererLink" href="graphics.html" target="_blank">Abrir salida limpia</a>
    </div>
  </aside>

  <datalist id="logoOptions">
    <option value="assets/page-04-image-04.png">Universal</option>
    <option value="assets/page-04-image-02.png">Union Vecinal</option>
    <option value="assets/page-06-image-04.png">Ciclista</option>
  </datalist>

  <main class="preview-shell">
    <section class="live-monitor" aria-label="Monitor OCR">
      <div class="live-head">
        <strong>Lectura desde la PC del cliente</strong>
        <span id="liveStatus">Esperando OBS</span>
      </div>
      <img id="boardPreview" alt="Captura del tablero" hidden>
      <dl>
        <div><dt>Tiempo</dt><dd id="liveClock">--:--</dd></div>
        <div><dt>Local</dt><dd id="liveHome">--</dd></div>
        <div><dt>Visita</dt><dd id="liveAway">--</dd></div>
        <div><dt>Periodo</dt><dd id="livePeriod">--</dd></div>
      </dl>
      <small id="lastCapture">Sin capturas</small>
    </section>
    <div class="stage-frame"><div class="stage stage-preview">
      <div data-scorebug></div>
    </div></div>
  </main>

  <template id="scorebugTemplate">
    <div class="feed-warning">LECTURA EN PAUSA · ÚLTIMO DATO</div>
    <section class="fbb-scorebug" aria-label="Club Estrella">
      <div class="fbb-mark">CAE</div>
      <div class="team-logo"><img data-logo="homeLogo" alt=""></div>
      <div class="team-name" data-bind="homeName">ESTRELLA</div>
      <div class="score-box" data-bind="homeScore">--</div>
      <div class="team-logo"><img data-logo="awayLogo" alt=""></div>
      <div class="team-name" data-bind="awayName">VISITA</div>
      <div class="score-box" data-bind="awayScore">--</div>
      <div class="period-box" data-bind="period">--</div>
      <div class="clock-box" data-bind="clock">--:--</div>

      <div class="info-box">
        <strong data-bind="tournament">LIGA PROVINCIAL FBB</strong>
        <span data-bind="category">U15 M - NORTE 2 / ZONA C</span>
      </div>
    </section>
  </template>

  <script src="script.js"></script>
</body>
</html>
